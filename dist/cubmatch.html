<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CubMatch</title>
<style>/* CUBMATCH — estilos. Mobile-first, max-width 560px, paleta cálida cubana. */
:root {
  --azul: #1565c0;
  --azul-osc: #0d47a1;
  --rojo: #d32f2f;
  --rojo-osc: #b71c1c;
  --fondo: #f5efe4;
  --tierra: #5d4037;
  --tierra-claro: #8d6e63;
  --blanco: #ffffff;
  --verde: #2e7d32;
  --amarillo: #f9a825;
  --gris: #9e9e9e;
  --radio: 14px;
  --sombra: 0 2px 10px rgba(93, 64, 55, 0.15);
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--fondo);
  color: #3e2723;
  min-height: 100vh;
  min-height: 100dvh;
}
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }

/* ---------- pantallas ---------- */
.screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.screen.has-nav { padding-bottom: 76px; }
.scroll { flex: 1; overflow-y: auto; }
.center-pad { text-align: center; padding: 48px 24px; }
.center-pad .big { font-size: 52px; margin: 0 0 8px; }
.muted { color: var(--tierra-claro); }
.small { font-size: 12px; }
.center { text-align: center; }
.mono { font-family: ui-monospace, monospace; word-break: break-all; }
.spinner {
  width: 40px; height: 40px; margin: 0 auto 12px;
  border: 4px solid #e0d5c1; border-top-color: var(--azul);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- inicio ---------- */
.inicio { justify-content: center; align-items: center; text-align: center; padding: 32px 24px;
  background: linear-gradient(160deg, #fff8ef 0%, var(--fondo) 60%, #efe3d0 100%); }
.brand .logo { font-size: 72px; line-height: 0; }
.brand .logo svg { filter: drop-shadow(0 3px 6px rgba(93, 64, 55, 0.3)); }
.brand h1 { font-size: 44px; margin: 8px 0; color: var(--rojo); letter-spacing: 1px; }
.tagline { font-size: 17px; color: var(--tierra); line-height: 1.5; }
.inicio-btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin: 20px 0; }
.fine { font-size: 13px; color: var(--tierra-claro); line-height: 1.6; }

/* cómo funciona + prueba social */
.como-funciona { width: 100%; max-width: 340px; margin: 14px 0 6px; background: var(--blanco);
  border-radius: var(--radio); box-shadow: var(--sombra); padding: 16px 18px; text-align: left; }
.como-funciona h3 { margin: 0 0 10px; font-size: 16px; color: var(--tierra); text-align: center; }
.como-funciona ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.como-funciona li { display: flex; gap: 10px; font-size: 14px; line-height: 1.45; color: var(--tierra); }
.nostr-det { margin-top: 12px; font-size: 13px; color: var(--tierra-claro); }
.nostr-det summary { cursor: pointer; color: var(--azul); }
.nostr-det p { margin: 6px 0 0; line-height: 1.5; }
.netcount { font-size: 14px; color: var(--tierra); margin: 4px 0 6px; }
.netcount b { color: var(--rojo); }

/* registro: aviso sin recuperación + validación en vivo */
.warn-box { display: flex; gap: 10px; background: #fff3e0; border: 2px solid var(--amarillo);
  border-radius: var(--radio); padding: 14px; margin: 14px 0; font-size: 14px;
  line-height: 1.5; color: var(--tierra); }
.warn-ico { font-size: 22px; flex-shrink: 0; }
.warn-box p { margin: 0 0 10px; }
.check-row { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; cursor: pointer; margin: 0; }
.check-row input { width: 20px; height: 20px; margin: 1px 0 0; flex-shrink: 0; accent-color: var(--rojo); }
.field-status { font-size: 13px; min-height: 18px; margin: -4px 0 8px; color: var(--tierra-claro); }
.field-status.ok { color: var(--verde); font-weight: 600; }
.field-status.bad { color: var(--rojo); font-weight: 600; }
.pw-wrap { position: relative; display: block; }
.pw-wrap input { width: 100%; padding-right: 48px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  background: none; border: none; font-size: 20px; cursor: pointer; padding: 9px; line-height: 1; }
.pw-meter { margin: 2px 0 10px; }
.pw-bar { height: 8px; background: #e8dcc8; border-radius: 4px; overflow: hidden; }
.pw-bar span { display: block; height: 100%; width: 0; transition: width 0.25s; background: var(--rojo); }
.pw-bar span.f1 { background: var(--rojo); }
.pw-bar span.f2 { background: var(--amarillo); }
.pw-bar span.f3 { background: var(--verde); }
.pw-meter small { font-size: 12px; color: var(--tierra-claro); }
.pw-meter small.s1 { color: var(--rojo); }
.pw-meter small.s2 { color: #b07d10; }
.pw-meter small.s3 { color: var(--verde); }

/* título de pantalla con mini logo */
.deck-title { display: flex; align-items: center; gap: 10px; }
.deck-title svg { flex-shrink: 0; }

/* ---------- botones ---------- */
.btn {
  border: none; border-radius: var(--radio); cursor: pointer;
  font-size: 16px; font-weight: 600; padding: 14px 20px;
  min-height: 52px; transition: transform 0.08s, opacity 0.15s;
  font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--azul); color: #fff; }
.btn.primary:active { background: var(--azul-osc); }
.btn.danger { background: var(--rojo); color: #fff; }
.btn.warn { background: var(--amarillo); color: #4e342e; }
.btn.ghost { background: transparent; color: var(--azul); border: 2px solid var(--azul); }
.btn.big { width: 100%; font-size: 18px; }
.btn.sm { padding: 8px 14px; min-height: 40px; font-size: 14px; }
.btn.round {
  width: 64px; height: 64px; min-height: 64px; border-radius: 50%;
  font-size: 26px; padding: 0; display: flex; align-items: center; justify-content: center;
  background: var(--blanco); box-shadow: var(--sombra); border: 2px solid #e8ddc9;
}
.btn.round.sm { width: 46px; height: 46px; min-height: 46px; font-size: 20px; }
.btn.round.like { color: var(--rojo); border-color: var(--rojo); }
.btn.round.dislike { color: var(--tierra-claro); }
.btn.round.super { color: var(--amarillo); border-color: var(--amarillo); }
.btn.round.info { color: var(--azul); border-color: var(--azul); font-style: italic; font-family: Georgia, serif; }
.link { background: none; border: none; color: var(--azul); font-size: 15px; cursor: pointer; padding: 8px; font-family: inherit; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- formularios ---------- */
.form-wrap { padding: 24px 20px 40px; max-width: 480px; margin: 0 auto; }
.form-wrap h2 { color: var(--tierra); margin: 12px 0 8px; }
.fld { display: block; margin: 14px 0; }
.fld > span, .fld-label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--tierra); font-size: 15px; }
.fld-label { margin: 18px 0 8px; }
input[type="text"], input[type="password"], input[type="number"], input[type="url"],
select, textarea {
  width: 100%; padding: 13px 14px; font-size: 16px; border-radius: 10px;
  border: 2px solid #d7c9b0; background: var(--blanco); color: #3e2723; font-family: inherit;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul); }
textarea { resize: vertical; }
.count { display: block; text-align: right; font-size: 12px; color: var(--tierra-claro); margin-top: 4px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; margin: 14px 0; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--azul); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.error-box {
  background: #fdecea; border: 2px solid var(--rojo); color: var(--rojo-osc);
  border-radius: 10px; padding: 12px 14px; margin: 14px 0; font-size: 15px;
}
.error-box ul { margin: 0; padding-left: 20px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
.chips.static { margin-top: 8px; }
.chip {
  border: 2px solid #d7c9b0; background: var(--blanco); color: var(--tierra);
  border-radius: 999px; padding: 9px 15px; font-size: 14px; cursor: pointer; font-family: inherit;
}
.chip.sel { background: var(--azul); border-color: var(--azul); color: #fff; font-weight: 600; }
.chip.mini { padding: 5px 11px; font-size: 12px; cursor: default; }

/* sliders */
.sliders { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.slider-row { display: grid; grid-template-columns: 1fr 2fr 34px; align-items: center; gap: 10px; font-size: 14px; }
.slider-row input[type="range"] { width: 100%; accent-color: var(--rojo); padding: 0; border: none; }
.slider-row b { text-align: right; color: var(--rojo); }

/* onboarding */
.ob-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--tierra-claro); }
.ob-head .pct { font-weight: 700; color: var(--azul); }
.prog { height: 10px; background: #e5d9c3; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.prog-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--azul), #42a5f5); border-radius: 999px; transition: width 0.3s; }
.ob-nav { display: flex; gap: 12px; margin-top: 24px; }
.ob-nav .btn { flex: 1; }
.prompt-row { margin-bottom: 10px; }
.prompt-row select { margin-bottom: 6px; }

/* ---------- nav inferior ---------- */
.tabnav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 560px; display: flex;
  background: var(--blanco); border-top: 2px solid #e8ddc9;
  padding-bottom: env(safe-area-inset-bottom); z-index: 50;
}
.tab {
  flex: 1; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 10px 4px 8px; font-size: 11px; color: var(--tierra-claro); font-family: inherit;
  min-height: 60px;
}
.tab .tico { font-size: 22px; }
.tab.active { color: var(--rojo); font-weight: 700; }

/* ---------- deck ---------- */
.deck-head { padding: 18px 18px 4px; display: flex; justify-content: space-between; align-items: center; }
.deck-head h2 { margin: 0; color: var(--tierra); }
.deck-head p { margin: 2px 0 0; font-size: 13px; }
.tarjeta {
  margin: 12px 14px 20px; background: var(--blanco); border-radius: 20px;
  overflow: hidden; box-shadow: var(--sombra);
}
.t-foto { position: relative; background: #e8ddc9; }
.t-foto .avatar.big { width: 100%; height: 340px; border-radius: 0; object-fit: cover; display: block; }
.compat {
  position: absolute; right: 14px; bottom: 14px;
  background: var(--rojo); color: #fff; font-weight: 800; font-size: 20px;
  border-radius: 999px; padding: 10px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.t-body { padding: 16px 18px 6px; }
.t-body h3 { margin: 0 0 2px; font-size: 22px; color: #3e2723; }
.t-body .muted { margin: 0 0 8px; font-size: 14px; }
.bio { font-size: 15px; line-height: 1.55; white-space: pre-wrap; }
.trespal { font-style: italic; color: var(--tierra); font-size: 15px; }
.prompt { background: #faf6ec; border-left: 4px solid var(--amarillo); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.prompt b { display: block; font-size: 13px; color: var(--tierra-claro); margin-bottom: 3px; }
.prompt span { font-size: 15px; }
.t-actions { display: flex; justify-content: space-around; align-items: center; padding: 14px 18px 20px; }

/* ---------- avatar ---------- */
.avatar { border-radius: 50%; object-fit: cover; background: #e8ddc9; }
.avatar.big { width: 120px; height: 120px; }
.avatar.sm { width: 52px; height: 52px; flex-shrink: 0; }
.avatar.xs { width: 38px; height: 38px; }

/* ---------- filas (top10 / matches) ---------- */
.rows { padding: 6px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.row {
  display: flex; align-items: center; gap: 10px;
  background: var(--blanco); border-radius: var(--radio); padding: 10px 12px;
  box-shadow: var(--sombra);
}
.rank { font-size: 20px; font-weight: 800; color: var(--amarillo); width: 26px; text-align: center; }
.r-main { flex: 1; min-width: 0; }
.r-main b { display: block; font-size: 16px; }
.r-main small { font-size: 13px; }
.r-main .pct { color: var(--rojo); }
.unread { color: var(--azul); }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(62, 39, 35, 0.6);
  display: flex; align-items: flex-end; justify-content: center; z-index: 100;
}
.sheet {
  background: var(--fondo); width: 100%; max-width: 560px;
  max-height: 92vh; max-height: 92dvh; overflow-y: auto;
  border-radius: 22px 22px 0 0; padding: 24px 20px 40px; position: relative;
}
.sheet .x { position: absolute; top: 12px; right: 12px; border: none; background: #e8ddc9;
  width: 38px; height: 38px; border-radius: 50%; font-size: 16px; cursor: pointer; }
.sheet.match { text-align: center; }
.sheet.match .big { font-size: 64px; }
.sheet.match h2 { color: var(--rojo); font-size: 32px; margin: 8px 0; }
.match-avatars { display: flex; justify-content: center; gap: 16px; margin: 16px 0 20px; }
.match-avatars .avatar { width: 84px; height: 84px; border: 3px solid var(--rojo); }
.sheet.detalle { text-align: center; }
.sheet.detalle .avatar.big { margin: 8px auto; display: block; }
.sheet.detalle h3 { margin: 6px 0 2px; font-size: 24px; }
.datos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; text-align: left; }
.dato { background: var(--blanco); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.dato span { display: block; color: var(--tierra-claro); font-size: 12px; }
.dato b { color: #3e2723; }
.rasgo { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; font-size: 13px; margin: 6px 0; text-align: left; }
.rbar { height: 8px; background: #e5d9c3; border-radius: 999px; overflow: hidden; }
.rbar > div { height: 100%; background: var(--azul); border-radius: 999px; }

/* ---------- chat ---------- */
.chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 76px); height: calc(100dvh - 76px); }
.chat-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--blanco); border-bottom: 2px solid #e8ddc9; }
.chat-nombre { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-acts { display: flex; gap: 6px; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { display: flex; }
.msg.me { justify-content: flex-end; }
.msg.peer { justify-content: flex-start; }
.bubble {
  max-width: 78%; padding: 10px 13px; border-radius: 16px; font-size: 15px;
  line-height: 1.45; word-wrap: break-word; position: relative;
}
.msg.me .bubble { background: var(--azul); color: #fff; border-bottom-right-radius: 4px; }
.msg.peer .bubble { background: var(--blanco); color: #3e2723; border-bottom-left-radius: 4px; box-shadow: var(--sombra); }
.mmeta { display: block; text-align: right; font-size: 11px; opacity: 0.75; margin-top: 4px; }
.tick.read { color: #aee2ff; font-weight: 700; }
.chat-form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--blanco); border-top: 2px solid #e8ddc9; }
.chat-form input { flex: 1; }
.chat-form .btn { min-height: 48px; padding: 10px 18px; }

/* ---------- ajustes ---------- */
.aj-wrap { padding: 20px 18px 30px; }
.aj-wrap h2 { color: var(--tierra); margin-top: 0; }
.aj-sec { background: var(--blanco); border-radius: var(--radio); padding: 16px; margin-bottom: 14px; box-shadow: var(--sombra); }
.aj-sec h3 { margin: 0 0 10px; color: var(--tierra); font-size: 17px; }
.aj-sec .dato { margin-bottom: 8px; }
.aj-sec .btn { margin-top: 8px; }
.relay-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f0e8d8; font-size: 14px; }
.relay-row:last-child { border-bottom: none; }
.rdot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: var(--gris); }
.rdot.g { background: var(--verde); box-shadow: 0 0 6px var(--verde); }
.rdot.y { background: var(--amarillo); }
.rdot.r { background: var(--rojo); }
.danger-zone { border: 2px solid var(--rojo); }

/* ---------- toasts ---------- */
#toasts { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; flex-direction: column; gap: 8px; width: min(92vw, 480px); align-items: center; pointer-events: none; }
.toast {
  background: #3e2723; color: #fff; padding: 12px 18px; border-radius: 999px;
  font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  animation: toast-in 0.25s ease-out; text-align: center; max-width: 100%;
}
.toast.out { opacity: 0; transition: opacity 0.4s; }
@keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }

@media (min-width: 600px) {
  body { background: #e9dfcc; }
  #app { box-shadow: 0 0 30px rgba(93, 64, 55, 0.25); }
  .overlay { align-items: center; }
  .sheet { border-radius: 22px; }
}
</style>
</head>
